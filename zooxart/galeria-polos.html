:root{--amarillo:#FFB60F;--negro:#0A0A0A;--blanco:#fff}

body{background:var(--negro); color:var(--blanco); overflow-x:hidden}
#zoox-header{position:fixed;top:0;left:0;right:0;height:64px;z-index:1000;background:rgba(10,10,10,0.92);backdrop-filter:blur(10px);display:flex;justify-content:space-between;align-items:center;padding:0 2em;border-bottom:1px solid rgba(255,255,255,0.08)}
#zoox-header img{height:32px}
#zoox-menu-toggle{background:none;border:none;display:flex;flex-direction:column;gap:5px;cursor:pointer}

#zoox-menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1001;opacity:0;pointer-events:none;transition:.3s}
#zoox-menu-overlay.is-active{opacity:1;pointer-events:all}
#zoox-menu{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:85vw;background:var(--amarillo);z-index:1002;transform:translateX(100%);transition:transform .4s cubic-bezier(.77,0,.175,1);padding:2em;display:flex;flex-direction:column}
#zoox-menu.is-active{transform:translateX(0)}
#zoox-menu ul{list-style:none;flex:1;margin-top:3em}
#zoox-menu ul li{border-top:1px solid rgba(0,0,0,0.12)}

.banner{padding:9em 2em 4em 2em;text-align:center;background:linear-gradient(180deg,#0A0A0A,#151515)}
.banner h1{font-weight:900;font-size:3.2em;letter-spacing:-0.02em}
.banner p{font-weight:300;color:#999;margin-top:0.5em}
.gallery-wrap{max-width:1400px;margin:0 auto;padding:2em;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gallery-wrap a{position:relative;overflow:hidden;display:block;aspect-ratio:4/5;background:#111}
.gallery-wrap a img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.gallery-wrap a:hover img{transform:scale(1.06)}
.gallery-wrap a::after{content:'';position:absolute;inset:0;border:0 solid var(--amarillo);transition:.3s}
.gallery-wrap a:hover::after{border-width:3px}
@media(max-width:980px){.gallery-wrap{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.gallery-wrap{grid-template-columns:1fr}}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.94);z-index:2000;display:none;align-items:center;justify-content:center;padding:2em}
#lightbox.is-active{display:flex}
#lightbox-inner{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#lightbox img#lb-img{max-width:90vw;max-height:84vh;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,0.7);animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:scale(0.98)}to{opacity:1;transform:scale(1)}}
.lb-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:#fff;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.4em;transition:all .2s;backdrop-filter:blur(6px)}
.lb-btn:hover{background:var(--amarillo);color:#000;border-color:var(--amarillo)}
#lb-prev{left:2vw}
#lb-next{right:2vw}
#lightbox-close{position:fixed;top:1.5em;right:1.5em;background:none;border:none;color:#fff;font-size:1.4em;cursor:pointer;z-index:2002;line-height:1}
#lb-counter{position:fixed;bottom:1.5em;left:50%;transform:translateX(-50%);background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.12);padding:0.4em 1em;border-radius:20px;font-size:0.8em;font-weight:300;letter-spacing:0.06em;backdrop-filter:blur(6px)}
#zoox-footer{background:#000;padding:3.5em 2em 3em 2em;text-align:center;border-top:1px solid rgba(255,255,255,0.06)}
#zoox-footer .footer-inner{display:flex;flex-direction:column;align-items:center;gap:1.2em}
#zoox-footer img{height:36px;opacity:0.9}
#zoox-footer p{color:#777;font-size:0.72em;letter-spacing:0.08em;font-weight:300;margin:0}
.footer-redes{list-style:none;display:flex;gap:1.8em;padding:0;margin:0}
.footer-redes a{color:#aaa;font-size:0.9em;text-decoration:none;font-weight:700;letter-spacing:0.05em;border:none;display:flex;align-items:center;gap:0.4em;transition:color .2s}
.footer-redes a:hover{color:var(--amarillo)}
.whatsapp-float{position:fixed;bottom:1.8rem;right:1.8rem;width:56px;height:56px;background:#25D366;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,0.45);z-index:9999;text-decoration:none;animation:zoox-pulse 2s infinite}
@keyframes zoox-pulse{0%{box-shadow:0 4px 20px rgba(37,211,102,0.45), 0 0 0 0 rgba(37,211,102,0.5)}70%{box-shadow:0 4px 20px rgba(37,211,102,0.45), 0 0 0 14px rgba(37,211,102,0)}100%{box-shadow:0 4px 20px rgba(37,211,102,0.45), 0 0 0 0 rgba(37,211,102,0)}}
</style>

<script>
const toggle=document.getElementById('zoox-menu-toggle'), close=document.getElementById('zoox-menu-close'), menu=document.getElementById('zoox-menu'), overlay=document.getElementById('zoox-menu-overlay');
function openM(){menu.classList.add('is-active');overlay.classList.add('is-active');document.body.style.overflow='hidden'}
function closeM(){menu.classList.remove('is-active');overlay.classList.remove('is-active');document.body.style.overflow=''}
toggle.addEventListener('click',openM);close.addEventListener('click',closeM);overlay.addEventListener('click',closeM);
const items = Array.from(document.querySelectorAll('#gallery a'));
const lb = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbCounter = document.getElementById('lb-counter');
const lbPrev = document.getElementById('lb-prev');
const lbNext = document.getElementById('lb-next');
const lbClose = document.getElementById('lightbox-close');
let current = 0;
function openLB(index){current=index;updateLB();lb.classList.add('is-active');document.body.style.overflow='hidden';}
function updateLB(){lbImg.src=items[current].href;lbCounter.textContent=(current+1)+' / '+items.length;}
function next(){current=(current+1)%items.length;updateLB();}
function prev(){current=(current-1+items.length)%items.length;updateLB();}
function closeLB(){lb.classList.remove('is-active');document.body.style.overflow='';}
items.forEach((a,i)=>{a.addEventListener('click',e=>{e.preventDefault();openLB(i);});});
lbNext.addEventListener('click',next);lbPrev.addEventListener('click',prev);lbClose.addEventListener('click',closeLB);
lb.addEventListener('click',e=>{if(e.target===lb) closeLB();});
document.addEventListener('keydown',e=>{if(!lb.classList.contains('is-active')) return;if(e.key==='ArrowRight') next();if(e.key==='ArrowLeft') prev();if(e.key==='Escape') closeLB();});
let startX=0;lb.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;});lb.addEventListener('touchend',e=>{let diff=e.changedTouches[0].clientX-startX;if(Math.abs(diff)>50){if(diff>0) prev(); else next();}});
</script>
