<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>¡Gracias por contactarnos! | ZOOX Pet Studio</title>
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/css/campton.css">
<style>
:root{--zoox-negro:#0A0A0A;--zoox-amarillo:#FFB60F;--zoox-blanco:#FFFFFF;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cera GR',sans-serif;}
html,body{height:100%;}
body{background:var(--zoox-negro);color:var(--zoox-blanco);display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;text-align:center;}
main{max-width:640px;width:100%;}
h1{font-weight:800;font-size:clamp(1.9rem,5vw,3rem);line-height:1.15;margin-bottom:1.4rem;}
p{font-weight:400;font-size:clamp(1rem,2.4vw,1.15rem);line-height:1.7;color:rgba(255,255,255,.85);max-width:56ch;margin:0 auto;}
.firma{margin-top:3rem;}
.firma img{height:46px;width:auto;display:block;margin:0 auto;}
.volver{display:inline-block;margin-top:2.2rem;padding:.9em 2em;background:var(--zoox-amarillo);color:var(--zoox-negro);font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-radius:4px;transition:background .2s,color .2s;}
.volver:hover{background:var(--zoox-blanco);}
</style>
</head>
<body>
<main>
  <h1>¡Gracias por contactarnos! 🐾</h1>
  <p>Hemos recibido tu solicitud correctamente. Estaremos revisando la información y nos pondremos en contacto contigo muy pronto para conocer mejor tu requerimiento y contarte cómo podemos ayudarte.</p>
  <a class="volver" href="../index.html">Volver al inicio</a>
  <div class="firma">
    <img src="../zooxstudio/images/logoblanco-zoox.png" alt="ZOOX Pet Studio">
  </div>
</main>
</body>
</html>
