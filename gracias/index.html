<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>¡Gracias por contactarnos! | ZOOX Pet Studio</title>
<link rel="icon" href="../favicon.png">
<link rel="apple-touch-icon" href="../favicon.png">
<link rel="stylesheet" href="../assets/css/campton.css">
<style>
:root{--zoox-negro:#0A0A0A;--zoox-amarillo:#D0FF28;--zoox-blanco:#FFFFFF;}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Cera GR',sans-serif;}
html,body{height:100%;}
body{background:var(--zoox-negro);color:var(--zoox-blanco);display:flex;align-items:center;justify-content:center;padding:2rem 1.5rem;text-align:center;}
main{max-width:640px;width:100%;}
h1{font-weight:700;font-size:clamp(2rem,5vw,3.4rem);line-height:1.15;margin-bottom:1.4rem;}
p{font-weight:400;font-size:clamp(1rem,2.4vw,1.15rem);line-height:1.7;color:#E5E5E5;max-width:56ch;margin:0 auto;}
.firma{margin-top:3rem;}
.firma img{height:46px;width:auto;display:block;margin:0 auto;}
  .volver{display:inline-flex;align-items:center;margin-top:2.2rem;padding:.5em .6em .5em 1.8em;background:#1A1E11;color:#E0FF70;border:1px solid #A5C74E;font-weight:700;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-radius:999px;transition:all .3s ease;}
  .volver:hover{background:#232915;border-color:#D5FF61;box-shadow:0 0 24px rgba(213,255,97,.35);}
  .btn-ico{display:inline-flex;align-items:center;justify-content:center;width:1.9em;height:1.9em;margin-left:.8em;border-radius:50%;background:#31391C;}
  .btn-arr{display:inline-block;transition:transform .25s ease;}
  .volver:hover .btn-arr{transform:translateX(4px);}
</style>
</head>
<body>
<main>
  <h1>¡Gracias por <span style="color:var(--zoox-amarillo)">contactarnos!</span></h1>
  <p>Hemos recibido tu solicitud correctamente. Estaremos revisando la información y nos pondremos en contacto contigo muy pronto para conocer mejor tu requerimiento y contarte cómo podemos ayudarte.</p>
  <a class="volver" href="../index.html">Volver al inicio <span class="btn-ico"><span class="btn-arr">→</span></span></a>
  <div class="firma">
    <img src="../zooxstudio/images/logoblanco-zoox.png" alt="ZOOX Pet Studio">
  </div>
</main>
</body>
</html>
